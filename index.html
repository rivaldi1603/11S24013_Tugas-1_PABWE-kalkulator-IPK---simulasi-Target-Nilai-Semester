<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic GPA Calculator & Target Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen py-8 px-4 font-sans text-slate-800">

    <main class="max-w-4xl mx-auto space-y-6">
        <!-- Header Semantik -->
        <header class="bg-indigo-700 text-white p-6 rounded-xl shadow-md">
            <h1 class="text-2xl font-bold">Kalkulator IP Semester & Simulasi Target IPK</h1>
            <p class="text-indigo-200 text-sm mt-1">
                Standar Skala Indeks Nilai: A (4.0), AB (3.5), B (3.0), BC (2.5), C (2.0), D (1.0), E (0.0)
            </p>
        </header>

        <!-- Kotak Notifikasi Validasi (WAI-ARIA Accessible) -->
        <div id="alert-box" role="alert" aria-live="assertive" class="hidden p-4 rounded-lg bg-red-100 border border-red-400 text-red-700 text-sm font-medium"></div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Panel Kiri: Kalkulator IP Semester -->
            <section class="md:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-slate-800">1. Daftar Mata Kuliah Semester Ini</h2>
                    <div class="space-x-3">
                        <button onclick="exportToCSV()" class="text-xs bg-slate-800 hover:bg-slate-900 text-white px-2.5 py-1 rounded transition">
                            Unduh CSV
                        </button>
                        <button onclick="resetCourses()" class="text-xs text-red-600 hover:underline font-medium">
                            Reset Data
                        </button>
                    </div>
                </div>

                <!-- Form Input Mata Kuliah -->
                <div class="grid grid-cols-1 sm:grid-cols-12 gap-2 mb-4 bg-slate-50 p-3 rounded-lg border border-slate-200">
                    <input type="text" id="input-name" placeholder="Nama Mata Kuliah (mis: PABWE)" aria-label="Nama Mata Kuliah" class="sm:col-span-6 p-2 border rounded text-sm focus:outline-indigo-600">
                    <input type="number" id="input-sks" placeholder="SKS (1-6)" min="1" max="6" aria-label="Jumlah SKS" class="sm:col-span-2 p-2 border rounded text-sm focus:outline-indigo-600">
                    <select id="input-grade" aria-label="Indeks Nilai" class="sm:col-span-2 p-2 border rounded text-sm bg-white focus:outline-indigo-600">
                        <option value="4.0">A (4.0)</option>
                        <option value="3.5">AB (3.5)</option>
                        <option value="3.0">B (3.0)</option>
                        <option value="2.5">BC (2.5)</option>
                        <option value="2.0">C (2.0)</option>
                        <option value="1.0">D (1.0)</option>
                        <option value="0.0">E (0.0)</option>
                    </select>
                    <button onclick="addCourse()" class="sm:col-span-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-3 rounded text-sm transition">
                        + Tambah
                    </button>
                </div>

                <!-- Tabel Daftar Mata Kuliah -->
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left border-collapse">
                        <thead>
                            <tr class="border-b bg-slate-50 text-slate-600">
                                <th class="py-2 px-3">Mata Kuliah</th>
                                <th class="py-2 px-3 text-center">SKS</th>
                                <th class="py-2 px-3 text-center">Nilai</th>
                                <th class="py-2 px-3 text-center">Bobot</th>
                                <th class="py-2 px-3 text-right">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="course-tbody" class="divide-y divide-slate-200"></tbody>
                    </table>
                </div>

                <!-- Ringkasan IP Semester -->
                <div class="mt-6 p-4 bg-indigo-50 rounded-lg flex justify-between items-center border border-indigo-100">
                    <div>
                        <p class="text-xs text-indigo-600 uppercase font-bold tracking-wider">Total SKS Semester</p>
                        <p id="total-sks" class="text-xl font-bold text-slate-800">0 SKS</p>
                    </div>
                    <div class="text-right">
                        <p class="text-xs text-indigo-600 uppercase font-bold tracking-wider">Indeks Prestasi (IP) Semester</p>
                        <p id="semester-gpa" class="text-3xl font-extrabold text-indigo-700">0.00</p>
                    </div>
                </div>
            </section>

            <!-- Panel Kanan: Simulasi Target IPK -->
            <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-slate-800 mb-4">2. Simulasi Target IPK</h2>
                <div class="space-y-3 text-sm">
                    <div>
                        <label for="current-gpa" class="block text-slate-600 mb-1 font-medium">IPK Saat Ini (0.00 - 4.00)</label>
                        <input type="number" id="current-gpa" step="0.01" min="0" max="4" placeholder="Contoh: 3.25" class="w-full p-2 border rounded focus:outline-indigo-600">
                    </div>
                    <div>
                        <label for="completed-sks" class="block text-slate-600 mb-1 font-medium">Total SKS Lulus Saat Ini</label>
                        <input type="number" id="completed-sks" min="1" max="160" placeholder="Contoh: 80" class="w-full p-2 border rounded focus:outline-indigo-600">
                    </div>
                    <div>
                        <label for="target-gpa" class="block text-slate-600 mb-1 font-medium">Target IPK yang Diinginkan</label>
                        <input type="number" id="target-gpa" step="0.01" min="0" max="4" placeholder="Contoh: 3.40" class="w-full p-2 border rounded focus:outline-indigo-600">
                    </div>
                    <div>
                        <label for="next-sks" class="block text-slate-600 mb-1 font-medium">Rencana SKS Semester Ini</label>
                        <input type="number" id="next-sks" min="1" max="24" placeholder="Contoh: 20" class="w-full p-2 border rounded focus:outline-indigo-600">
                    </div>
                    <button onclick="simulateTarget()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg transition mt-2">
                        Analisis Target IPK
                    </button>
                </div>

                <!-- Hasil Simulasi Target IPK -->
                <div id="simulation-result" class="hidden mt-4 p-4 rounded-lg text-sm"></div>
            </section>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
